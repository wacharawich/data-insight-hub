<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CL69 — ทะเบียนคุมแผนจัดซื้อจัดจ้าง โรงพยาบาลนางรอง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Prompt', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: #fafaf8;
      border-bottom: 1px solid #e5e5e0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 36px; height: 36px; border-radius: 6px; }
    .header-title { font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
    .live-dot {
      width: 8px; height: 8px; background: #22c55e; border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Container */
    .container { max-width: 1280px; margin: 0 auto; padding: 24px; }

    /* Loading / Error */
    .loading, .error {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh; gap: 12px;
      font-size: 14px; color: #888;
    }
    .error { color: #ef4444; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #e5e5e0;
      border-top-color: #888; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: #fafaf8;
      border: 1px solid #e5e5e0;
      border-radius: 12px;
      padding: 20px;
    }
    .summary-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .summary-value {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.2;
    }
    .summary-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

    /* Plan Breakdown */
    .plan-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .plan-card {
      background: #fafaf8;
      border: 1px solid #e5e5e0;
      border-radius: 12px;
      padding: 16px 20px;
      text-align: center;
    }
    .plan-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 4px;
    }
    .plan-value {
      font-size: 20px;
      font-weight: 600;
    }
    .plan-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* Section */
    .section {
      background: #fafaf8;
      border: 1px solid #e5e5e0;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #555;
    }

    /* Chart Dimension Selector */
    .dim-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .dim-btn {
      padding: 6px 14px;
      border: 1px solid #e5e5e0;
      border-radius: 20px;
      background: transparent;
      font-family: 'Prompt', sans-serif;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
    }
    .dim-btn:hover { border-color: #999; color: #333; }
    .dim-btn.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    /* Chart Container */
    .chart-box { position: relative; height: 320px; width: 100%; }

    /* TOP 10 Grid */
    .top10-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .top10-card {
      background: #fafaf8;
      border: 1px solid #e5e5e0;
      border-radius: 12px;
      padding: 20px;
    }
    .top10-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #555;
      margin-bottom: 12px;
    }
    .top10-chart { position: relative; height: 260px; width: 100%; }

    /* Data Table */
    .table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e5e5e0;
      border-radius: 8px;
      padding: 8px 14px;
      flex: 1;
      max-width: 360px;
    }
    .search-box input {
      border: none;
      outline: none;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      width: 100%;
      background: transparent;
    }
    .search-icon { color: #aaa; font-size: 14px; }

    .export-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border: 1px solid #e5e5e0;
      border-radius: 8px;
      background: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 12px;
      color: #555;
      cursor: pointer;
      transition: all 0.15s;
    }
    .export-btn:hover { border-color: #999; color: #1a1a1a; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #e5e5e0;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      background: #f5f5f0;
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #666;
      border-bottom: 1px solid #e5e5e0;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
      position: relative;
    }
    thead th:hover { color: #1a1a1a; }
    thead th .sort-arrow {
      margin-left: 4px;
      font-size: 10px;
      color: #888;
    }
    thead th.sort-active .sort-arrow { color: #22c55e; }
    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0eb;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tbody tr:hover { background: #fafaf8; }
    tbody tr:nth-child(even) { background: #fafaf7; }
    tbody tr:nth-child(even):hover { background: #f5f5f0; }
    td.price { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty-row td { text-align: center; color: #aaa; padding: 40px 14px; }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12px;
      color: #888;
    }
    .page-btns { display: flex; gap: 4px; }
    .page-btn {
      padding: 6px 12px;
      border: 1px solid #e5e5e0;
      border-radius: 6px;
      background: transparent;
      font-family: 'Prompt', sans-serif;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
    }
    .page-btn:hover { border-color: #999; }
    .page-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Tooltip */
    .tip { position: relative; }
    .tip:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 24px;
      font-size: 11px;
      color: #aaa;
      letter-spacing: 0.5px;
    }

    @media (max-width: 768px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
      .plan-grid { grid-template-columns: 1fr; }
      .top10-grid { grid-template-columns: 1fr; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img class="header-logo"
        src="https://upload.wikimedia.org/wikipedia/commons/f/f9/%E0%B8%95%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%97%E0%B8%A3%E0%B8%A7%E0%B8%87%E0%B8%AA%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%A3%E0%B8%93%E0%B8%AA%E0%B8%B8%E0%B8%82%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88.png"
        alt="logo">
      <div>
        <div class="header-title">CL69</div>
        <div class="header-subtitle">ทะเบียนคุมแผนจัดซื้อจัดจ้าง โรงพยาบาลนางรอง</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="live-dot"></span>
      <span style="font-size:11px;color:#888;letter-spacing:1px;">LIVE</span>
    </div>
  </div>

  <div class="container" id="app">
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <div>กำลังโหลดข้อมูล...</div>
    </div>
  </div>

  <div class="footer">CL69 · ทะเบียนคุมแผนจัดซื้อจัดจ้าง โรงพยาบาลนางรอง</div>

<script>
// ── Globals ──
let ALL_DATA = [];
let currentDim = 'month';
let searchTerm = '';
let sortCol = -1;
let sortAsc = true;
let currentPage = 1;
const PAGE_SIZE = 20;

const COLUMNS = [
  { key: 'regNo',       label: 'เลขทะเบียนคุม', align: 'left' },
  { key: 'month',       label: 'เดือน',         align: 'left' },
  { key: 'missionGroup',label: 'กลุ่มภารกิจ',   align: 'left' },
  { key: 'workGroup',   label: 'กลุ่มงาน',      align: 'left' },
  { key: 'department',  label: 'หน่วยงาน',      align: 'left' },
  { key: 'item',        label: 'รายการ',         align: 'left' },
  { key: 'category',    label: 'หมวด',           align: 'left' },
  { key: 'type',        label: 'ประเภท',         align: 'left' },
  { key: 'price',       label: 'ราคาเสนอ',      align: 'right' },
  { key: 'planType',    label: 'ประเภทแผน',     align: 'left' }
];

const DIMENSIONS = [
  { key: 'month',        label: 'เดือน' },
  { key: 'missionGroup', label: 'กลุ่มภารกิจ' },
  { key: 'workGroup',    label: 'กลุ่มงาน' },
  { key: 'department',   label: 'หน่วยงาน' },
  { key: 'item',         label: 'รายการ' },
  { key: 'category',     label: 'หมวด' },
  { key: 'type',         label: 'ประเภท' },
  { key: 'price',        label: 'ราคาเสนอ' },
  { key: 'planType',     label: 'ประเภทแผน' }
];

const MONTH_ORDER = [
  'ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
  'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'
];

// ── Utility ──
function fmt(n) {
  return Number(n).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function fmtShort(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return fmt(n);
}
function toBE(yearStr) {
  const m = String(yearStr).match(/(\d{4})/);
  if (m) return String(Number(m[1]) + 543);
  return String(yearStr);
}
function formatMonth(raw) {
  if (!raw) return '';
  const s = String(raw).trim();
  // Try to parse "YYYY-MM" or "เดือน MM/YYYY" etc.
  const mY = s.match(/(\d{4})[-\/](\d{1,2})/);
  if (mY) {
    const mon = Number(mY[2]) - 1;
    const be = Number(mY[1]) + 543;
    if (mon >= 0 && mon < 12) return MONTH_ORDER[mon] + ' ' + be;
  }
  // Already Thai month format or other
  // Convert any embedded CE year to BE
  return s.replace(/(\d{4})/g, function(y) { return String(Number(y) + 543); });
}

function getFilteredData() {
  let d = ALL_DATA;
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    d = d.filter(function(row) {
      return COLUMNS.some(function(c) {
        return String(row[c.key]).toLowerCase().indexOf(q) !== -1;
      });
    });
  }
  return d;
}

function getSortedData(data) {
  if (sortCol < 0) return data;
  const col = COLUMNS[sortCol];
  const key = col.key;
  const arr = data.slice();
  arr.sort(function(a, b) {
    let va = a[key], vb = b[key];
    if (key === 'price') {
      va = Number(va) || 0;
      vb = Number(vb) || 0;
    } else {
      va = String(va || '').toLowerCase();
      vb = String(vb || '').toLowerCase();
    }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  return arr;
}

// ── Render ──
function render() {
  const data = getFilteredData();
  const sorted = getSortedData(data);
  const totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageData = sorted.slice(start, start + PAGE_SIZE);

  const app = document.getElementById('app');

  // Summary
  const total = data.reduce(function(s, r) { return s + (Number(r.price) || 0); }, 0);
  const depts = new Set(data.map(function(r) { return r.department; })).size;
  const items = new Set(data.map(function(r) { return r.item; })).size;

  // Plan breakdown
  const planPrices = { 'ในแผน': 0, 'นอกแผน': 0, 'ทดแทน': 0 };
  data.forEach(function(r) {
    const pt = String(r.planType || '').trim();
    if (planPrices.hasOwnProperty(pt)) planPrices[pt] += Number(r.price) || 0;
  });

  let html = '';

  // Summary cards
  html += '<div class="summary-grid">';
  html += '<div class="summary-card"><div class="summary-label">ราคารวม</div><div class="summary-value">฿' + fmt(total) + '</div></div>';
  html += '<div class="summary-card"><div class="summary-label">จำนวนหน่วยงาน</div><div class="summary-value">' + depts + '</div></div>';
  html += '<div class="summary-card"><div class="summary-label">จำนวนรายการ</div><div class="summary-value">' + items + '</div></div>';
  html += '</div>';

  // Plan breakdown
  html += '<div class="plan-grid">';
  const planColors = { 'ในแผน': '#22c55e', 'นอกแผน': '#f59e0b', 'ทดแทน': '#3b82f6' };
  ['ในแผน', 'นอกแผน', 'ทดแทน'].forEach(function(label) {
    html += '<div class="plan-card">';
    html += '<div class="plan-label"><span class="plan-dot" style="background:' + planColors[label] + '"></span>' + label + '</div>';
    html += '<div class="plan-value">฿' + fmt(planPrices[label]) + '</div>';
    html += '</div>';
  });
  html += '</div>';

  // Bar chart section
  html += '<div class="section">';
  html += '<div class="section-header">';
  html += '<div class="section-title">📊 กราฟวิเคราะห์ยอดรวมราคาเสนอ</div>';
  html += '<div class="dim-selector">';
  DIMENSIONS.forEach(function(d) {
    html += '<button class="dim-btn' + (currentDim === d.key ? ' active' : '') + '" onclick="setDim(\'' + d.key + '\')">' + d.label + '</button>';
  });
  html += '</div></div>';
  html += '<div class="chart-box"><canvas id="barChart"></canvas></div>';
  html += '</div>';

  // TOP 10
  const top10Dims = ['missionGroup', 'workGroup', 'department', 'item', 'category', 'type'];
  html += '<div class="top10-grid">';
  top10Dims.forEach(function(key) {
    const dim = DIMENSIONS.find(function(d) { return d.key === key; });
    html += '<div class="top10-card">';
    html += '<div class="top10-title">TOP 10 · ' + dim.label + '</div>';
    html += '<div class="top10-chart"><canvas id="top10_' + key + '"></canvas></div>';
    html += '</div>';
  });
  html += '</div>';

  // Data Table
  html += '<div class="section">';
  html += '<div class="section-header">';
  html += '<div class="section-title">📋 ตารางข้อมูลทั้งหมด</div>';
  html += '<div style="display:flex;gap:8px;align-items:center;">';
  html += '<div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="ค้นหาข้อมูล..." value="' + searchTerm.replace(/"/g, '&quot;') + '" oninput="onSearch(this.value)"></div>';
  html += '<button class="export-btn" onclick="exportCSV()">⬇ ส่งออก CSV</button>';
  html += '</div></div>';

  html += '<div class="table-wrap"><table><thead><tr>';
  COLUMNS.forEach(function(col, i) {
    let arrow = '';
    let cls = '';
    if (sortCol === i) {
      cls = ' class="sort-active"';
      arrow = sortAsc ? ' ▲' : ' ▼';
    } else {
      arrow = ' ⇅';
    }
    html += '<th' + cls + ' onclick="onSort(' + i + ')">' + col.label + '<span class="sort-arrow">' + arrow + '</span></th>';
  });
  html += '</tr></thead><tbody>';

  if (pageData.length === 0) {
    html += '<tr class="empty-row"><td colspan="' + COLUMNS.length + '">ไม่พบข้อมูล</td></tr>';
  } else {
    pageData.forEach(function(row) {
      html += '<tr>';
      COLUMNS.forEach(function(col) {
        let val = row[col.key];
        if (col.key === 'price') {
          val = '฿' + fmt(val);
          html += '<td class="price">' + val + '</td>';
        } else if (col.key === 'month') {
          html += '<td class="tip" data-tip="' + String(val || '').replace(/"/g, '&quot;') + '">' + formatMonth(val) + '</td>';
        } else {
          const display = String(val || '');
          const trunc = display.length > 40 ? display.substring(0, 37) + '...' : display;
          html += '<td class="tip" data-tip="' + display.replace(/"/g, '&quot;') + '">' + trunc + '</td>';
        }
      });
      html += '</tr>';
    });
  }
  html += '</tbody></table></div>';

  // Pagination
  html += '<div class="pagination">';
  html += '<div>แสดง ' + (sorted.length > 0 ? start + 1 : 0) + '-' + Math.min(start + PAGE_SIZE, sorted.length) + ' จาก ' + sorted.length + ' รายการ</div>';
  html += '<div class="page-btns">';
  html += '<button class="page-btn" onclick="goPage(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>‹ ก่อนหน้า</button>';
  for (var p = 1; p <= totalPages; p++) {
    if (totalPages > 7 && p > 3 && p < totalPages - 1 && Math.abs(p - currentPage) > 1) {
      if (p === 4 || p === totalPages - 2) html += '<span style="padding:6px;color:#aaa;">...</span>';
      continue;
    }
    html += '<button class="page-btn' + (p === currentPage ? ' active' : '') + '" onclick="goPage(' + p + ')">' + p + '</button>';
  }
  html += '<button class="page-btn" onclick="goPage(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>ถัดไป ›</button>';
  html += '</div></div>';
  html += '</div>';

  app.innerHTML = html;

  // Draw charts after DOM is ready
  setTimeout(function() {
    drawBarChart(data);
    top10Dims.forEach(function(key) { drawTop10Chart(key, data); });
  }, 50);
}

// ── Charts ──
function groupBy(data, key) {
  const map = {};
  data.forEach(function(row) {
    let k = String(row[key] || '').trim();
    if (k === '') k = '(ว่าง)';
    if (key === 'month') k = formatMonth(row.month) || k;
    if (!map[k]) map[k] = 0;
    map[k] += Number(row.price) || 0;
  });
  return map;
}

function drawBarChart(data) {
  const canvas = document.getElementById('barChart');
  if (!canvas) return;
  const map = groupBy(data, currentDim);

  let entries = Object.entries(map);
  // Sort months chronologically, others by value desc
  if (currentDim === 'month') {
    entries.sort(function(a, b) {
      return MONTH_ORDER.indexOf(a[0].split(' ')[0]) - MONTH_ORDER.indexOf(b[0].split(' ')[0]);
    });
  } else {
    entries.sort(function(a, b) { return b[1] - a[1]; });
  }

  // Limit display (except month)
  if (currentDim !== 'month' && entries.length > 12) entries = entries.slice(0, 12);

  const labels = entries.map(function(e) { return e[0]; });
  const values = entries.map(function(e) { return e[1]; });

  const existing = Chart.getChart(canvas);
  if (existing) existing.destroy();

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: '#1a1a1a',
        borderRadius: 4,
        maxBarThickness: 48
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: {
            font: { family: 'Prompt', size: 11 },
            maxRotation: 45,
            callback: function(v) {
              var lbl = this.getLabelForValue(v);
              return lbl.length > 14 ? lbl.substring(0, 12) + '…' : lbl;
            }
          },
          grid: { display: false }
        },
        y: {
          ticks: {
            font: { family: 'Prompt', size: 11 },
            callback: function(v) { return '฿' + fmtShort(v); }
          },
          grid: { color: '#f0f0eb' }
        }
      }
    }
  });
}

function drawTop10Chart(dimKey, data) {
  const canvas = document.getElementById('top10_' + dimKey);
  if (!canvas) return;
  const map = groupBy(data, dimKey);
  const entries = Object.entries(map)
    .sort(function(a, b) { return b[1] - a[1]; })
    .slice(0, 10)
    .reverse();

  const labels = entries.map(function(e) { return e[0]; });
  const values = entries.map(function(e) { return e[1]; });

  const existing = Chart.getChart(canvas);
  if (existing) existing.destroy();

  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: '#555',
        borderRadius: 4,
        maxBarThickness: 24
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          ticks: {
            font: { family: 'Prompt', size: 10 },
            callback: function(v) { return '฿' + fmtShort(v); }
          },
          grid: { color: '#f0f0eb' }
        },
        y: {
          ticks: {
            font: { family: 'Prompt', size: 11 },
            callback: function(v) {
              var lbl = this.getLabelForValue(v);
              return lbl.length > 12 ? lbl.substring(0, 10) + '…' : lbl;
            }
          },
          grid: { display: false }
        }
      }
    }
  });
}

// ── Interactions ──
function setDim(key) {
  currentDim = key;
  render();
}

function onSearch(val) {
  searchTerm = val;
  currentPage = 1;
  render();
}

function onSort(colIndex) {
  if (sortCol === colIndex) {
    if (sortAsc) { sortAsc = false; }
    else { sortCol = -1; sortAsc = true; }
  } else {
    sortCol = colIndex;
    sortAsc = true;
  }
  currentPage = 1;
  render();
}

function goPage(p) {
  currentPage = p;
  render();
  // Scroll to table
  var el = document.querySelector('.section:last-child');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function exportCSV() {
  const data = getSortedData(getFilteredData());
  const BOM = '\uFEFF';
  let csv = BOM + COLUMNS.map(function(c) { return c.label; }).join(',') + '\n';
  data.forEach(function(row) {
    csv += COLUMNS.map(function(c) {
      let val = String(row[c.key] || '');
      if (c.key === 'month') val = formatMonth(val);
      if (c.key === 'price') val = Number(val).toFixed(2);
      // Escape quotes
      if (val.indexOf(',') !== -1 || val.indexOf('"') !== -1 || val.indexOf('\n') !== -1) {
        val = '"' + val.replace(/"/g, '""') + '"';
      }
      return val;
    }).join(',') + '\n';
  });
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'CL69_ทะเบียนคุม_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Init ──
function init() {
  google.script.run
    .withSuccessHandler(function(json) {
      try {
        var result = JSON.parse(json);
        if (result.error) {
          document.getElementById('app').innerHTML = '<div class="error">⚠ ' + result.error + '</div>';
          return;
        }
        ALL_DATA = result.data || [];
        render();
      } catch (e) {
        document.getElementById('app').innerHTML = '<div class="error">⚠ ข้อมูลไม่ถูกต้อง</div>';
      }
    })
    .withFailureHandler(function(err) {
      document.getElementById('app').innerHTML = '<div class="error">⚠ เกิดข้อผิดพลาด: ' + (err.message || err) + '<br>ตรวจสอบ Google Sheet ID และสิทธิ์การเข้าถึง</div>';
    })
    .getSheetData();
}

document.addEventListener('DOMContentLoaded', init);
</script>
